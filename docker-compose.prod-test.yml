services:
  medixa-chat-web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
        VITE_SOCKET_BASE_URL: ""
    environment:
      BACKEND_UPSTREAM: http://host.docker.internal:4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    restart: unless-stopped
